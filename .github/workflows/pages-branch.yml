# Deploy the static site (this `doc` branch) to the gh-pages branch.
# Repo setting: Settings → Pages → Build and deployment → Deploy from branch → gh-pages / (root)
# The site sources (index.html, assets/, per-lab index.html) live on the `doc` branch;
# the `develop` branch holds the current course code.
name: Deploy to gh-pages branch

on:
  push:
    branches: ["doc"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-branch"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/projects/{CV,DL,LLM,PhySim}
          mkdir -p _site/projects/Physical-AI/Physical-Simulation/Genesis-Simulation
          mkdir -p _site/projects/Physical-AI/Physical-Simulation/Mujoco-Simulation/{mujoco-torch,mujoco-MJX}
          mkdir -p _site/projects/Physical-AI/Real-Deployment/{Robot-Policy-Deployment,ROS2-Deployment}
          cp index.html .nojekyll _site/
          cp -r assets _site/
          cp projects/Physical-AI/index.html _site/projects/Physical-AI/
          cp projects/Physical-AI/Physical-Simulation/Genesis-Simulation/index.html _site/projects/Physical-AI/Physical-Simulation/Genesis-Simulation/
          cp projects/Physical-AI/Physical-Simulation/Mujoco-Simulation/mujoco-torch/index.html _site/projects/Physical-AI/Physical-Simulation/Mujoco-Simulation/mujoco-torch/
          cp projects/Physical-AI/Physical-Simulation/Mujoco-Simulation/mujoco-MJX/index.html _site/projects/Physical-AI/Physical-Simulation/Mujoco-Simulation/mujoco-MJX/
          cp projects/Physical-AI/Real-Deployment/Robot-Policy-Deployment/index.html _site/projects/Physical-AI/Real-Deployment/Robot-Policy-Deployment/
          cp projects/Physical-AI/Real-Deployment/ROS2-Deployment/index.html _site/projects/Physical-AI/Real-Deployment/ROS2-Deployment/
          cp projects/CV/index.html _site/projects/CV/
          cp projects/DL/index.html _site/projects/DL/
          cp projects/LLM/index.html _site/projects/LLM/
          cp projects/PhySim/index.html _site/projects/PhySim/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
