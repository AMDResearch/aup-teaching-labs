name: Build Course Image

on:
  workflow_call:
    inputs:
      context:
        description: Course directory containing the Dockerfile and build context
        required: true
        type: string
      image-name:
        description: Image name, including any fork suffix (e.g. auplc-cv-dev)
        required: true
        type: string
      registry-prefix:
        description: Registry and namespace for the output image
        default: ghcr.io/amdresearch
        type: string
      base-image:
        description: Base image repository (auplc-base or auplc-default, or auplc-code-gpu / auplc-code-cpu for code-server courses); the release comes from <context>/base-version.txt
        default: ghcr.io/amdresearch/auplc-base
        type: string
      gpu-targets:
        description: JSON array of GPU target names, or ["cpu"] for a CPU base
        default: '["gfx1151"]'
        type: string
      default-gpu-target:
        description: Target that also publishes unsuffixed tag aliases
        default: gfx1151
        type: string
      push:
        description: Push images (never for PRs); the caller must grant packages write
        default: false
        type: boolean
      version:
        description: Optional additional image tag for manual builds
        default: ''
        type: string
      disk-cleanup:
        description: Free runner disk space before building large courses
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.image-name }} (${{ matrix.gpu_target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu_target: ${{ fromJSON(inputs.gpu-targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: inputs.disk-cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve base image
        id: base
        env:
          VERSION_FILE: ${{ inputs.context }}/base-version.txt
          BASE_REPO: ${{ inputs.base-image }}
          GPU_TARGET: ${{ matrix.gpu_target }}
        run: |
          version=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$VERSION_FILE" | grep -v '^$' || true)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error file=$VERSION_FILE::Set one released AUP Learning Cloud version (vX.Y.Z)"
            exit 1
          fi
          # CPU bases (auplc-default, auplc-code-cpu) have no target suffix.
          if [[ "$GPU_TARGET" == cpu ]]; then
            ref="$BASE_REPO:$version"
          else
            ref="$BASE_REPO:$version-$GPU_TARGET"
          fi
          # Build on the digest so a re-pushed tag cannot change the base mid-run.
          if ! digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "::error file=$VERSION_FILE::Base image $ref is not published or not publicly readable"
            exit 1
          fi
          echo "image=$ref@$digest" >> "$GITHUB_OUTPUT"
          echo "Base image: \`$ref@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve registry host
        id: registry
        env:
          PREFIX: ${{ inputs.registry-prefix }}
        run: echo "host=${PREFIX%%/*}" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        if: inputs.push && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (target-suffixed tags)
        id: meta-suffixed
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry-prefix }}/${{ inputs.image-name }}
          flavor: |
            latest=false
            suffix=-${{ matrix.gpu_target }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=pr

      - name: Docker metadata (default-target aliases)
        if: matrix.gpu_target == inputs.default-gpu-target
        id: meta-default
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry-prefix }}/${{ inputs.image-name }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=pr

      - name: Merge tags
        id: tags
        env:
          SUFFIXED_TAGS: ${{ steps.meta-suffixed.outputs.tags }}
          DEFAULT_TAGS: ${{ steps.meta-default.outputs.tags }}
        run: |
          {
            echo 'tags<<EOF'
            printf '%s\n' "$SUFFIXED_TAGS" "$DEFAULT_TAGS" | sed '/^$/d' | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push course image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            ${{ steps.meta-suffixed.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=course-${{ inputs.image-name }}-${{ matrix.gpu_target }}
          cache-to: type=gha,mode=max,scope=course-${{ inputs.image-name }}-${{ matrix.gpu_target }}
          provenance: false
