name: Line Endings

# Courses build and run on Linux, where CRLF breaks shell scripts and shebangs,
# so committed text files must use LF.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check LF line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject CRLF in committed text files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pull requests check the files they add or change, so files that
          # already have CRLF do not block unrelated work; manual runs check
          # every file.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            git diff -z --name-only --no-renames --diff-filter=d "$base" "$PR_HEAD" > "$RUNNER_TEMP/files"
          else
            git ls-files -z > "$RUNNER_TEMP/files"
          fi
          # ls-files --eol reports the committed line endings; binary files
          # report -text and are skipped.
          bad=$(xargs -0 -r git ls-files --eol -- < "$RUNNER_TEMP/files" \
            | awk -F '\t' '$1 ~ /^i\/(crlf|mixed) / { print $2 }')
          if [[ -z "$bad" ]]; then
            echo "All checked text files use LF."
            exit 0
          fi
          while IFS= read -r file; do
            echo "::error file=$file::Committed with CRLF line endings; convert the file to LF (for example: sed -i 's/\r\$//' \"$file\")"
          done <<< "$bad"
          {
            echo "### Files with CRLF line endings"
            echo
            sed 's/^/- /' <<< "$bad"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
