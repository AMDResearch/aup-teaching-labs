name: Build Course Images

# Builds changed courses to check pull requests. Nothing is pushed: AUP Learning
# Cloud publishes course images from its aup-teaching-labs submodule.
on:
  pull_request:
    paths:
      - 'projects/**'
      - '.github/build-config.json'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/build-course.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      all-gpu-targets:
        description: Build every GPU target instead of only the default one
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select changed courses
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.config.outputs.courses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load config and detect changes
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ALL_GPU_TARGETS: ${{ inputs.all-gpu-targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          config = json.loads(Path('.github/build-config.json').read_text())
          courses = config['courses']
          # Manual runs build every course; pull requests build changed courses.
          if os.environ['EVENT_NAME'] == 'pull_request':
              head = os.environ['PR_HEAD']
              base = subprocess.check_output([
                  'git', 'merge-base', os.environ['PR_BASE'], head
              ], text=True).strip()
              paths = subprocess.check_output([
                  'git', 'diff', '--no-renames', '--name-only', '-z', base, head
              ]).decode().split('\0')
              shared = {
                  '.github/build-config.json',
                  '.github/workflows/docker-build.yml',
                  '.github/workflows/build-course.yml',
                  '.gitattributes',
              }
              if not shared.intersection(paths):
                  courses = [course for course in courses if any(
                      path.startswith(course['context'].rstrip('/') + '/')
                      for path in paths
                  )]

          # Course CI checks that the course builds; LC builds and publishes
          # every target. Build all targets only when asked on a manual run.
          targets = [t['name'] for t in config['gpu_targets']]
          if os.environ.get('ALL_GPU_TARGETS') != 'true':
              targets = [config['default_gpu_target']]

          # A course with "cpu": true builds only the cpu target. Courses that
          # do not set base_image build on auplc-base, or auplc-default for cpu.
          for course in courses:
              cpu = course.get('cpu') is True
              course.setdefault('base_image', 'ghcr.io/amdresearch/auplc-default' if cpu
                                else 'ghcr.io/amdresearch/auplc-base')
              course['build_targets'] = ['cpu'] if cpu else targets
              course['default_target'] = 'cpu' if cpu else config['default_gpu_target']

          outputs = {
              'courses': json.dumps(courses, separators=(',', ':')),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in outputs.items():
                  print(f'{key}={value}', file=output)
          PY

  build-courses:
    name: Build ${{ matrix.course.name }}
    needs: changes
    if: needs.changes.outputs.courses != '[]'
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.changes.outputs.courses) }}
    uses: ./.github/workflows/build-course.yml
    with:
      context: ${{ matrix.course.context }}
      image-name: ${{ matrix.course.image }}
      base-image: ${{ matrix.course.base_image }}
      gpu-targets: ${{ toJSON(matrix.course.build_targets) }}
      default-gpu-target: ${{ matrix.course.default_target }}
      push: false
      disk-cleanup: ${{ matrix.course.disk_cleanup == true }}
