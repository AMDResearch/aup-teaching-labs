name: Build Course Images

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'projects/**'
      - '.github/build-config.json'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/build-course.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/build-config.json'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/build-course.yml'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      version:
        description: Additional image tag (e.g. rc1)
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select changed courses
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.config.outputs.courses }}
      gpu-targets: ${{ steps.config.outputs.gpu-targets }}
      default-gpu-target: ${{ steps.config.outputs.default-gpu-target }}
      base-tag: ${{ steps.config.outputs.base-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load config and detect changes
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          config = json.loads(Path('.github/build-config.json').read_text())
          courses = config['courses']
          event = os.environ['EVENT_NAME']
          ref_type = os.environ['REF_TYPE']
          if event != 'workflow_dispatch' and ref_type != 'tag':
              head = os.environ['GITHUB_SHA']
              if event == 'pull_request':
                  head = os.environ['PR_HEAD']
                  base = subprocess.check_output([
                      'git', 'merge-base', os.environ['PR_BASE'], head
                  ], text=True).strip()
              else:
                  base = os.environ['BEFORE']
              # New branches and unavailable pre-force-push commits build all courses.
              if base and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0:
                  paths = subprocess.check_output([
                      'git', 'diff', '--no-renames', '--name-only', '-z', base, head
                  ]).decode().split('\0')
                  shared = {
                      '.github/build-config.json',
                      '.github/workflows/docker-build.yml',
                      '.github/workflows/build-course.yml',
                      '.gitattributes',
                  }
                  if not shared.intersection(paths):
                      courses = [course for course in courses if any(
                          path.startswith(course['context'].rstrip('/') + '/')
                          for path in paths
                      )]

          ref = os.environ['BASE_REF'] or os.environ['REF_NAME']
          base_tag = ref if ref_type == 'tag' or ref == 'develop' else 'latest'
          outputs = {
              'courses': json.dumps(courses, separators=(',', ':')),
              'gpu-targets': json.dumps([t['name'] for t in config['gpu_targets']]),
              'default-gpu-target': config['default_gpu_target'],
              'base-tag': base_tag,
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in outputs.items():
                  print(f'{key}={value}', file=output)
          PY

  build-courses:
    name: Build ${{ matrix.course.name }}
    needs: changes
    if: needs.changes.outputs.courses != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.changes.outputs.courses) }}
    uses: ./.github/workflows/build-course.yml
    with:
      context: ${{ matrix.course.context }}
      image-name: ${{ matrix.course.image }}
      gpu-targets: ${{ needs.changes.outputs.gpu-targets }}
      default-gpu-target: ${{ needs.changes.outputs.default-gpu-target }}
      base-tag: ${{ needs.changes.outputs.base-tag }}
      push: ${{ github.event_name != 'pull_request' }}
      version: ${{ inputs.version || '' }}
      disk-cleanup: ${{ matrix.course.disk_cleanup == true }}
